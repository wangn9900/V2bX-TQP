name: Build TQP Backend (All Architectures)

on:
  workflow_dispatch:
  push:
    branches:
      - tqp-main

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, freebsd, darwin]
        goarch: [amd64, arm64, 386, arm, riscv64, mips, mipsle, mips64, mips64le]
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
        exclude:
          - goos: darwin
            goarch: 386
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: riscv64
          - goos: linux
            goarch: 386 # 现代后端通常不需要 32 位 linux
    runs-on: ubuntu-latest
    fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout V2bX-TQP
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build TQP Backend
        run: |
          mkdir -p build_assets
          # 针对 MIPS 特殊处理
          if [ "${{ matrix.goarch }}" = "mips" ] || [ "${{ matrix.goarch }}" = "mipsle" ]; then
            export GOMIPS=softfloat
          fi
          
          BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          fi

          export GOTOOLCHAIN=local
          # 编译所有插件支持
          go build -v -o build_assets/$BINARY_NAME -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-s -w -buildid="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build_assets/*
