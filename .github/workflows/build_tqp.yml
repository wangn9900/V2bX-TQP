name: Build TQP Backend (Official Matrix)

on:
  workflow_dispatch:
  push:
    branches:
      - tqp-main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, freebsd, darwin]
        goarch: [amd64, arm64, 386, arm, riscv64, mips, mipsle, mips64, mips64le]
        include:
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: android
            goarch: arm64
        exclude:
          - goarch: 386
            goos: darwin
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: riscv64
          - goos: freebsd
            goarch: mips
          - goos: freebsd
            goarch: mipsle
          - goos: freebsd
            goarch: mips64
          - goos: freebsd
            goarch: mips64le
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # 必须开启 jsonv2 实验特性，否则官方 V2bX 源码无法编译
      GOEXPERIMENT: jsonv2 
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0' # 强制升级到 1.25 以支持官方源码的 json/v2

      - name: Build V2bX-TQP
        run: |
          mkdir -p build_assets
          if [ "${{ matrix.goarch }}" = "mips" ] || [ "${{ matrix.goarch }}" = "mipsle" ]; then
            export GOMIPS=softfloat
          fi
          
          BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          fi

          go build -v -o build_assets/$BINARY_NAME -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-s -w -buildid="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: build_assets/*
