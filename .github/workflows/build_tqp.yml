name: Build TQP Backend (Public Repo Only)

on:
  workflow_dispatch:
  push:
    branches:
      - tqp-main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout V2bX-TQP
        uses: actions/checkout@v4
        with:
          # 公开库直接拉取子模块，不需要任何 Secret
          submodules: recursive

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build V2bX-TQP
        run: |
          mkdir -p build_assets
          BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          fi

          export GOTOOLCHAIN=local
          go build -v -o build_assets/$BINARY_NAME -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-s -w -buildid="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build_assets/*
