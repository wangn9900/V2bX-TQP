name: Build TQP Backend (Official Matrix)

on:
  workflow_dispatch:
  push:
    branches:
      - tqp-main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: android
            goarch: arm64
          - goos: freebsd
            goarch: arm64
        exclude:
          - goarch: 386
            goos: darwin
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build V2bX-TQP
        run: |
          mkdir -p build_assets
          # MIPS 软浮点支持
          if [ "${{ matrix.goarch }}" = "mips" ] || [ "${{ matrix.goarch }}" = "mipsle" ]; then
            export GOMIPS=softfloat
          fi
          
          BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          fi

          export GOTOOLCHAIN=local
          go build -v -o build_assets/$BINARY_NAME -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-s -w -buildid="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: build_assets/*
