name: Build TQP Backend (Official Matrix)

on:
  workflow_dispatch:
  push:
    branches:
      - tqp-main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: android
            goarch: arm64
          - goos: freebsd
            goarch: arm64
        exclude:
          - goarch: 386
            goos: darwin
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: riscv64
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout V2bX-TQP
        uses: actions/checkout@v4

      - name: Force Pull TQP Core (Crucial)
        # 这一步极其重要：手动把影子内核拉到指定目录，解决 protocol/tqp 找不到的问题
        run: |
          rm -rf sing-box_mod
          git clone --branch tqp-main https://github.com/wangn9900/sing-box-tqp.git sing-box_mod

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build V2bX-TQP
        run: |
          mkdir -p build_assets
          if [ "${{ matrix.goarch }}" = "mips" ] || [ "${{ matrix.goarch }}" = "mipsle" ]; then
            export GOMIPS=softfloat
          fi
          
          BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          fi

          export GOTOOLCHAIN=local
          # 执行编译，现在 sing-box_mod 目录已经真实存在，replace 规则将生效
          go build -v -o build_assets/$BINARY_NAME -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-s -w -buildid="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-TQP-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build_assets/*

  # 新增：将编译好的产物发布到 Release 页面，方便服务器 wget
  publish-release:
    name: Create TQP Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          find ./all-artifacts -type f -exec cp {} ./release_files/ \;
          ls -R release_files/

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: tqp-latest
          name: "TQP Protocol Backend (Latest Build)"
          body: |
            这是最新的 TQP 专用后端构建版。
            构建时间: ${{ github.event.head_commit.timestamp }}
            包含全架构二进制文件。
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
